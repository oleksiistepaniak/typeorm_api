# PIPELINE TITLE
name: TypeORM API CI Pipeline

# TRIGGER
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# JOBS
jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and Install Node.Js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

#      - name: Run Unit Tests
#        run: npm test
